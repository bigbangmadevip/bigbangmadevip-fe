name: Deploy Next.js with Docker Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: bigbangmadevip-fe-production
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push AMD64 Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKER_REPO }}:latest
            ${{ secrets.DOCKER_REPO }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_FRONTEND_URL=${{ vars.NEXT_PUBLIC_FRONTEND_URL }}
            NEXT_PUBLIC_FIREBASE_VAPID_KEY=${{ vars.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
            DEPLOYMENT_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_IP }}
          username: ${{ secrets.SSH_ID }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            cleanup_old_frontend_images() {
              docker images "${{ secrets.DOCKER_REPO }}" --format '{{.ID}}' \
                | sort -u \
                | while read -r image_id; do
                    [ -n "$image_id" ] || continue

                    if ! docker ps -a --filter "ancestor=$image_id" --format '{{.ID}}' | grep -q .; then
                      docker rmi "$image_id" 2>/dev/null || true
                    fi
                  done
            }

            # SHA 태그가 붙은 이전 배포 이미지를 먼저 비워 pull 공간을 확보한다.
            # 현재 실행 중인 컨테이너가 사용하는 이미지는 보존된다.
            cleanup_old_frontend_images
            docker image prune -f

            docker pull "${{ secrets.DOCKER_REPO }}:${{ github.sha }}"
            docker stop bigbangmadevip-fe 2>/dev/null || true
            docker rm bigbangmadevip-fe 2>/dev/null || true
            docker run -d \
              --name bigbangmadevip-fe \
              --restart unless-stopped \
              --network bigbangmadevip-net \
              -p 3000:3000 \
              "${{ secrets.DOCKER_REPO }}:${{ github.sha }}"

            # 교체 후 사용하지 않게 된 직전 이미지까지 제거한다.
            cleanup_old_frontend_images
            docker image prune -f
